name: Build NeuroBook master (Linux x64)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to build (master, tag, or commit SHA)"
        required: true
        default: "master"
        type: string

permissions:
  contents: write

concurrency:
  group: neurobook-master-linux-build
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Build Linux x64 Product
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream source
        shell: bash
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/notnotype/neuro-book.git
          git fetch --force --tags upstream "${UPSTREAM_REF}"
          git checkout --detach FETCH_HEAD

          upstream_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=10 HEAD)"
          version="$(node -p "require('./packages/neuro-book/package.json').version")"

          echo "UPSTREAM_SHA=${upstream_sha}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${short_sha}" >> "${GITHUB_ENV}"
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "BUILD_TAG=master-${short_sha}" >> "${GITHUB_ENV}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Prepare release output
        run: bun scripts/release/release-output.ts prepare --github-env

      - name: Build Nuxt Product
        run: bun run --cwd packages/neuro-book nuxt:build

      - name: Build Source archive
        run: bun run release:source

      - name: Build Linux x64 Product archive
        run: bun run release:product:linux

      - name: Create checksums and build metadata
        shell: bash
        env:
          UPSTREAM_REF_INPUT: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          cd "${NEURO_BOOK_RELEASE_DIR}"

          test -f neuro-book-source.zip
          test -f neuro-book-product-linux-x64-glibc.tar.gz

          sha256sum \
            neuro-book-source.zip \
            neuro-book-product-linux-x64-glibc.tar.gz \
            > SHA256SUMS

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          names = [
              "neuro-book-source.zip",
              "neuro-book-product-linux-x64-glibc.tar.gz",
          ]

          assets = {}
          for name in names:
              p = Path(name)
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              assets[name] = {
                  "bytes": p.stat().st_size,
                  "sha256": h.hexdigest(),
              }

          info = {
              "schema": 1,
              "kind": "neuro-book-master-linux-x64",
              "repository": "notnotype/neuro-book",
              "upstreamRef": os.environ.get("UPSTREAM_REF_INPUT", "master"),
              "upstreamSha": os.environ["UPSTREAM_SHA"],
              "shortSha": os.environ["SHORT_SHA"],
              "appVersion": os.environ["APP_VERSION"],
              "builtAt": datetime.now(timezone.utc).isoformat(),
              "assets": assets,
          }

          Path("build-info.json").write_text(
              json.dumps(info, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          cat SHA256SUMS
          cat build-info.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: neuro-book-linux-x64-${{ env.SHORT_SHA }}
          if-no-files-found: error
          path: |
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-source.zip
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/neuro-book-product-linux-x64-glibc.tar.gz
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/SHA256SUMS
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/build-info.json

      - name: Publish build ref
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/neurobook-upstream-build --force

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${NEURO_BOOK_RELEASE_DIR}"

          notes="${RUNNER_TEMP}/release-notes.md"
          cat > "${notes}" <<EOF
          Automated Linux x64 build from upstream \`notnotype/neuro-book\`.

          - Upstream ref: \`${{ inputs.upstream_ref }}\`
          - Upstream commit: \`${UPSTREAM_SHA}\`
          - App version: \`${APP_VERSION}\`
          - Build tag: \`${BUILD_TAG}\`

          Unofficial fork build; not an upstream NeuroBook release.
          EOF

          if gh release view "${BUILD_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${BUILD_TAG}" \
              neuro-book-source.zip \
              neuro-book-product-linux-x64-glibc.tar.gz \
              SHA256SUMS \
              build-info.json \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${BUILD_TAG}" \
              neuro-book-source.zip \
              neuro-book-product-linux-x64-glibc.tar.gz \
              SHA256SUMS \
              build-info.json \
              --target neurobook-upstream-build \
              --title "NeuroBook master ${SHORT_SHA}" \
              --notes-file "${notes}" \
              --prerelease \
              --repo "${GITHUB_REPOSITORY}"
          fi
